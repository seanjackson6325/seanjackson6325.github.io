<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="green-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyan-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="#070b10"/>

  <!-- Grid -->
  <g stroke="#00ff44" stroke-width="0.4" opacity="0.07">
    <line x1="0" y1="40"  x2="200" y2="40"/>
    <line x1="0" y1="80"  x2="200" y2="80"/>
    <line x1="0" y1="120" x2="200" y2="120"/>
    <line x1="0" y1="160" x2="200" y2="160"/>
    <line x1="40"  y1="0" x2="40"  y2="200"/>
    <line x1="80"  y1="0" x2="80"  y2="200"/>
    <line x1="120" y1="0" x2="120" y2="200"/>
    <line x1="160" y1="0" x2="160" y2="200"/>
  </g>

  <!-- Win95 bevel border — outer highlight -->
  <line x1="0"   y1="0"   x2="200" y2="0"   stroke="#ffffff" stroke-width="3"/>
  <line x1="0"   y1="0"   x2="0"   y2="200" stroke="#ffffff" stroke-width="3"/>
  <!-- Win95 bevel border — outer shadow -->
  <line x1="0"   y1="199" x2="200" y2="199" stroke="#404040" stroke-width="3"/>
  <line x1="199" y1="0"   x2="199" y2="200" stroke="#404040" stroke-width="3"/>
  <!-- Win95 bevel border — inner highlight -->
  <line x1="3"   y1="3"   x2="197" y2="3"   stroke="#c0c0c0" stroke-width="1.5"/>
  <line x1="3"   y1="3"   x2="3"   y2="197" stroke="#c0c0c0" stroke-width="1.5"/>
  <!-- Win95 bevel border — inner shadow -->
  <line x1="3"   y1="197" x2="197" y2="197" stroke="#808080" stroke-width="1.5"/>
  <line x1="197" y1="3"   x2="197" y2="197" stroke="#808080" stroke-width="1.5"/>

  <!-- Corner bracket accents -->
  <rect x="10" y="10" width="8" height="2" fill="#00eeff" opacity="0.75"/>
  <rect x="10" y="10" width="2" height="8" fill="#00eeff" opacity="0.75"/>
  <rect x="182" y="10" width="8" height="2" fill="#00eeff" opacity="0.75"/>
  <rect x="188" y="10" width="2" height="8" fill="#00eeff" opacity="0.75"/>
  <rect x="10" y="188" width="8" height="2" fill="#00eeff" opacity="0.75"/>
  <rect x="10" y="182" width="2" height="8" fill="#00eeff" opacity="0.75"/>
  <rect x="182" y="188" width="8" height="2" fill="#00eeff" opacity="0.75"/>
  <rect x="188" y="182" width="2" height="8" fill="#00eeff" opacity="0.75"/>

  <!-- SJ — glow bloom layer -->
  <text x="100" y="126"
        font-family="'Courier New', Courier, monospace"
        font-size="102" font-weight="bold"
        text-anchor="middle"
        fill="#00ff55" opacity="0.22"
        letter-spacing="-4">SJ</text>

  <!-- SJ — main text -->
  <text x="100" y="126"
        font-family="'Courier New', Courier, monospace"
        font-size="102" font-weight="bold"
        text-anchor="middle"
        fill="#00ff55"
        filter="url(#green-glow)"
        letter-spacing="-4">SJ</text>

  <!-- Underline rule -->
  <rect x="28" y="140" width="144" height="2" fill="#00eeff" opacity="0.8" filter="url(#cyan-glow)"/>

  <!-- Name -->
  <text x="100" y="162"
        font-family="'Courier New', Courier, monospace"
        font-size="10" text-anchor="middle"
        fill="#00eeff" letter-spacing="4" opacity="0.9">SEAN JACKSON</text>

  <!-- Tagline -->
  <text x="100" y="178"
        font-family="'Courier New', Courier, monospace"
        font-size="6" text-anchor="middle"
        fill="#33ff66" letter-spacing="1.5" opacity="0.5">ML ENGINEER · PHYSICIST</text>

  <!-- Version stamp -->
  <text x="14" y="22"
        font-family="'Courier New', Courier, monospace"
        font-size="6.5" fill="#333" letter-spacing="0.5">v2026</text>
</svg>
